# Vanilla effects the pack replaces or does not need
oldLighting=false
separateAo=false
underwaterOverlay=false
vignette=false

# Shadow pass
shadowBlockEntities=false
shadowPlayer=true
blend.shadow=off
#ifdef ENTITY_SHADOWS
shadowEntities=true
#else
shadowEntities=false
#endif
#ifdef COLORED_SHADOWS
shadowTranslucent=true
#else
shadowTranslucent=false
#endif

# Clouds: the pack can override the clouds option of the video settings
#if CLOUD_MODE == 1
clouds=off
#elif CLOUD_MODE == 2
clouds=fast
#elif CLOUD_MODE == 3
clouds=fancy
#endif

# Colored block light: a voxel grid around the camera (size = LPV_SIZE in lib/common.glsl).
# The shadow pass records light sources into it, so it has to run even without shadows.
# It needs image writes and a compute shader; where Iris does not support them it is left out.
iris.features.optional=CUSTOM_IMAGES COMPUTE_SHADERS BLOCK_EMISSION_ATTRIBUTE
#if defined COLORED_LIGHTS && defined IRIS_FEATURE_CUSTOM_IMAGES && defined IRIS_FEATURE_COMPUTE_SHADERS
shadow.culling=reversed
image.voxelImg=voxelSampler rgba rgba8 unsigned_byte true false 64 32 64
image.lightImgA=lightSamplerA rgba rgba16f half_float false false 64 32 64
image.lightImgB=lightSamplerB rgba rgba16f half_float false false 64 32 64
image.extraImgA=extraSamplerA rg rg16f half_float false false 64 32 64
image.extraImgB=extraSamplerB rg rg16f half_float false false 64 32 64
program.shadow.enabled=true
program.shadowcomp.enabled=true
#else
program.shadow.enabled=SHADOWS
program.shadowcomp.enabled=false
#endif

# Options screen
screen=[SCREEN_UPSCALING] [SCREEN_SHADOWS] [SCREEN_LIGHTING] [SCREEN_SKY] [SCREEN_WATER] [SCREEN_COLOR]
screen.columns=2
screen.SCREEN_UPSCALING=RENDER_SCALE SHARPENING TAA_RESPONSE
screen.SCREEN_SHADOWS=SHADOWS ENTITY_SHADOWS COLORED_SHADOWS shadowDistance shadowMapResolution SHADOW_SAMPLES SHADOW_SOFTNESS sunPathRotation
screen.SCREEN_LIGHTING=EXPOSURE SUN_BRIGHTNESS MOON_BRIGHTNESS AMBIENT_BRIGHTNESS BLOCKLIGHT_BRIGHTNESS MIN_BRIGHTNESS NIGHT_VISION_MODE NIGHT_VISION_STRENGTH COLORED_LIGHTS COLORED_LIGHT_STRENGTH GLASS_TINT_STRENGTH COLORED_LIGHT_SPREAD COLORED_LIGHT_FALLOFF GLOW_LIGHT_LEVEL
screen.SCREEN_SKY=SKY_BRIGHTNESS CELESTIAL_BRIGHTNESS STAR_BRIGHTNESS FOG_DENSITY BORDER_FOG_START UNDERWATER_FOG CLOUD_MODE CLOUD_BRIGHTNESS CLOUD_OPACITY
screen.SCREEN_WATER=WATER_WAVES WAVE_STRENGTH WAVE_SPEED WATER_REFLECTION SUN_GLINT WATER_OPACITY
screen.SCREEN_COLOR=SATURATION CONTRAST
sliders=RENDER_SCALE SHARPENING TAA_RESPONSE shadowDistance shadowMapResolution SHADOW_SAMPLES SHADOW_SOFTNESS sunPathRotation EXPOSURE SUN_BRIGHTNESS MOON_BRIGHTNESS AMBIENT_BRIGHTNESS BLOCKLIGHT_BRIGHTNESS MIN_BRIGHTNESS NIGHT_VISION_STRENGTH COLORED_LIGHT_STRENGTH GLASS_TINT_STRENGTH COLORED_LIGHT_SPREAD COLORED_LIGHT_FALLOFF GLOW_LIGHT_LEVEL SKY_BRIGHTNESS CELESTIAL_BRIGHTNESS STAR_BRIGHTNESS FOG_DENSITY BORDER_FOG_START UNDERWATER_FOG CLOUD_BRIGHTNESS CLOUD_OPACITY WAVE_STRENGTH WAVE_SPEED WATER_REFLECTION SUN_GLINT WATER_OPACITY SATURATION CONTRAST LIGHT_COLOR_TORCH_R LIGHT_COLOR_TORCH_G LIGHT_COLOR_TORCH_B LIGHT_BRIGHTNESS_TORCH LIGHT_RANGE_TORCH LIGHT_COLOR_LAVA_R LIGHT_COLOR_LAVA_G LIGHT_COLOR_LAVA_B LIGHT_BRIGHTNESS_LAVA LIGHT_RANGE_LAVA LIGHT_COLOR_SOUL_R LIGHT_COLOR_SOUL_G LIGHT_COLOR_SOUL_B LIGHT_BRIGHTNESS_SOUL LIGHT_RANGE_SOUL LIGHT_COLOR_REDSTONE_R LIGHT_COLOR_REDSTONE_G LIGHT_COLOR_REDSTONE_B LIGHT_BRIGHTNESS_REDSTONE LIGHT_RANGE_REDSTONE LIGHT_COLOR_GLOWSTONE_R LIGHT_COLOR_GLOWSTONE_G LIGHT_COLOR_GLOWSTONE_B LIGHT_BRIGHTNESS_GLOWSTONE LIGHT_RANGE_GLOWSTONE LIGHT_COLOR_SEA_R LIGHT_COLOR_SEA_G LIGHT_COLOR_SEA_B LIGHT_BRIGHTNESS_SEA LIGHT_RANGE_SEA LIGHT_COLOR_PORTAL_R LIGHT_COLOR_PORTAL_G LIGHT_COLOR_PORTAL_B LIGHT_BRIGHTNESS_PORTAL LIGHT_RANGE_PORTAL LIGHT_COLOR_GREEN_R LIGHT_COLOR_GREEN_G LIGHT_COLOR_GREEN_B LIGHT_BRIGHTNESS_GREEN LIGHT_RANGE_GREEN LIGHT_COLOR_FRAME_R LIGHT_COLOR_FRAME_G LIGHT_COLOR_FRAME_B LIGHT_BRIGHTNESS_FRAME

# Screens for the AH Client menu only. Nothing links to them, so Iris never shows them.
ahclient.screens=SCREEN_LIGHT_COLORS
screen.SCREEN_LIGHT_COLORS=LIGHT_COLOR_TORCH_R LIGHT_COLOR_TORCH_G LIGHT_COLOR_TORCH_B LIGHT_BRIGHTNESS_TORCH LIGHT_RANGE_TORCH LIGHT_COLOR_LAVA_R LIGHT_COLOR_LAVA_G LIGHT_COLOR_LAVA_B LIGHT_BRIGHTNESS_LAVA LIGHT_RANGE_LAVA LIGHT_COLOR_SOUL_R LIGHT_COLOR_SOUL_G LIGHT_COLOR_SOUL_B LIGHT_BRIGHTNESS_SOUL LIGHT_RANGE_SOUL LIGHT_COLOR_REDSTONE_R LIGHT_COLOR_REDSTONE_G LIGHT_COLOR_REDSTONE_B LIGHT_BRIGHTNESS_REDSTONE LIGHT_RANGE_REDSTONE LIGHT_COLOR_GLOWSTONE_R LIGHT_COLOR_GLOWSTONE_G LIGHT_COLOR_GLOWSTONE_B LIGHT_BRIGHTNESS_GLOWSTONE LIGHT_RANGE_GLOWSTONE LIGHT_COLOR_SEA_R LIGHT_COLOR_SEA_G LIGHT_COLOR_SEA_B LIGHT_BRIGHTNESS_SEA LIGHT_RANGE_SEA LIGHT_COLOR_PORTAL_R LIGHT_COLOR_PORTAL_G LIGHT_COLOR_PORTAL_B LIGHT_BRIGHTNESS_PORTAL LIGHT_RANGE_PORTAL LIGHT_COLOR_GREEN_R LIGHT_COLOR_GREEN_G LIGHT_COLOR_GREEN_B LIGHT_BRIGHTNESS_GREEN LIGHT_RANGE_GREEN LIGHT_COLOR_FRAME_R LIGHT_COLOR_FRAME_G LIGHT_COLOR_FRAME_B LIGHT_BRIGHTNESS_FRAME
